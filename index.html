<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09130d" />
  <title>ASCENSÃO OS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bootScreen" class="boot-screen">
    <h1>ASCENSÃO OS // NEXUS</h1>
    <p class="muted">SISTEMA OPERACIONAL DE CAMPANHA</p>
    <button id="bootStart" class="btn btn-primary">INICIAR SISTEMA (Toque para conectar)</button>
    <div id="bootLog" class="terminal"></div>
    <div class="progress-wrap"><div id="bootProgress" class="progress-bar"></div></div>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>ASCENSÃO OS</h1>
      <div id="playerHud" class="hud"></div>
    </header>

    <section id="nowPanel" class="panel now">
      <h2>AGORA — MISSÃO ATUAL</h2>
      <p id="currentWindow" class="muted"></p>
      <div id="missionCard" class="mission-card"></div>
      <div class="actions">
        <button id="btnCompleteMission" class="btn btn-success">Concluir</button>
        <button id="btnSkipMission" class="btn btn-danger">Pular (penalidade)</button>
      </div>
    </section>

    <nav id="tabs" class="tabs"></nav>
    <main id="tabContent"></main>

    <div id="toast" class="toast"></div>

    <dialog id="modal" class="modal">
      <div id="modalBody"></div>
      <form method="dialog"><button class="btn">Fechar</button></form>
    </dialog>
  </div>

  <script src="app.js"></script>
</body>
</html>
